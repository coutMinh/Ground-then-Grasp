[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ground-then-grasp"
version = "0.1.0"
description = "Reproducible factorized language-driven grasp detection"
requires-python = ">=3.11"
dependencies = [
  "filelock>=3.13,<4",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "psutil>=5.9,<8",
  "scipy>=1.12,<2",
  "scikit-image>=0.23,<1",
  "shapely>=2,<3",
  "torch>=2.3,<3",
]

[project.optional-dependencies]
grounder = ["transformers==4.57.1", "huggingface-hub>=0.34,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
paper = ["pypdf>=5,<7", "matplotlib>=3.9,<4"]

[project.scripts]
g2g = "g2g.cli:main"

[tool.setuptools.packages.find]
include = ["g2g*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
